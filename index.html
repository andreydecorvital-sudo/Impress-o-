<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Etiqueta ZPL Otimizada</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f1ea;color:#111;font-family:Arial,sans-serif}.w{width:min(1100px,calc(100% - 24px));margin:auto}header{padding:20px 0;border-bottom:1px solid #d8d2c7;font-weight:900;font-size:20px}h1{font-size:clamp(38px,6vw,68px);line-height:.95;letter-spacing:-.05em;margin:35px 0 12px}.sub{color:#6d685f;font-size:17px;margin-bottom:25px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-bottom:40px}.p{background:#fff;border:1px solid #d8d2c7;border-radius:20px;padding:16px;min-width:0}h2{margin:0 0 12px}textarea{width:100%;min-height:390px;border:1px solid #ccc;border-radius:12px;padding:12px;font:12px/1.4 Consolas,monospace;resize:vertical}.a{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:999px;padding:12px 17px;font-weight:800;cursor:pointer}.go{background:#6d3df5;color:#fff}.dark{background:#111;color:#fff}button:disabled{opacity:.45}.status{min-height:42px;margin-top:10px;font-weight:700;line-height:1.35}.ok{color:#137a4b}.warn{color:#9a5b00}.err{color:#b42318}.bar{height:8px;background:#e7e0d5;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#6d3df5}.out{min-height:390px;border:1px dashed #bbb2a5;border-radius:12px;padding:12px;overflow:hidden}.empty{color:#6d685f;text-align:center;margin:150px auto}.card{border:2px solid #111;padding:12px;margin:0 auto 14px;max-width:500px;background:#fff}.img{max-height:520px;overflow:auto;border:1px solid #ccc}.img canvas{width:100%;height:auto;display:block}.result{margin-top:10px;border-top:3px solid #111;padding-top:10px}.row{display:flex;justify-content:space-between;gap:10px}.big{font-size:21px;font-weight:900}.small{font-size:12px;color:#555;margin-top:5px}.box{border:2px solid #111;padding:8px;margin-top:8px}.raw{white-space:pre-wrap;background:#eee;padding:8px;max-height:140px;overflow:auto;font:11px Consolas,monospace}@media(max-width:850px){.grid{grid-template-columns:1fr}textarea{min-height:300px}}</style></head><body><header><div class="w">Etiqueta ZPL Otimizada</div></header><main class="w"><h1>Gerar etiquetas</h1><div class="sub">Cole o ZPL, abra o GRF/Z64 e leia os dados visíveis da etiqueta.</div><div class="grid"><section class="p"><h2>1. Cole o ZPL</h2><textarea id="zpl" placeholder="Cole o ZPL completo aqui..."></textarea><div class="a"><button type="button" class="go" id="go">Gerar etiquetas</button><button type="button" id="clear">Limpar</button></div><div id="status" class="status ok">Pronto.</div><div class="bar"><i id="bar"></i></div></section><section class="p"><h2>2. Resultado</h2><div id="out" class="out"><div class="empty">Nenhuma etiqueta processada.</div></div><div class="a"><button type="button" class="dark" id="copy" disabled>Copiar resultado</button><button type="button" class="go" id="download" disabled>Baixar .txt</button></div></section></div></main><script>(function(){'use strict';const NL=String.fromCharCode(10),q=s=>document.querySelector(s),z=q('#zpl'),go=q('#go'),st=q('#status'),out=q('#out'),bar=q('#bar'),cp=q('#copy'),dl=q('#download');let result='',libs=null;function msg(t,c){st.textContent=t;st.className='status '+c}function progress(n){bar.style.width=Math.max(0,Math.min(100,n))+'%'}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function script(src){return new Promise((a,b)=>{const x=document.createElement('script');x.src=src;x.onload=a;x.onerror=()=>b(new Error('Falha ao carregar biblioteca'));document.head.appendChild(x)})}async function load(urls,test){if(test())return;for(const u of urls){try{await script(u);if(test())return}catch(e){}}throw new Error('As bibliotecas de leitura não carregaram')}function libraries(){if(!libs)libs=(async()=>{msg('Carregando leitor...','warn');await load(['https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js','https://unpkg.com/pako@2.1.0/dist/pako.min.js'],()=>!!window.pako);await load(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'],()=>!!window.Tesseract)})().catch(e=>{libs=null;throw e});return libs}function bytes(b64,total){const a=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),i=window.pako.inflate(a);if(i.length===total)return i;const t=new TextDecoder().decode(i).replace(/\s/g,'');if(/^[0-9a-f]+$/i.test(t)&&t.length>=total*2){const r=new Uint8Array(total);for(let x=0;x<total;x++)r[x]=parseInt(t.slice(x*2,x*2+2),16);return r}return i.slice(0,total)}function images(raw){const s=raw.split(String.fromCharCode(13)).join('').split(NL).join(''),rx=/(?:~DG|\^DG)([^,]+),(\d+),(\d+),:Z64:([A-Za-z0-9+/=]+)(?::[0-9A-Fa-f]+)?/g,r=[];let m;while((m=rx.exec(s))){const total=+m[2],bpr=+m[3],data=bytes(m[4],total),rows=Math.ceil(total/bpr),c=document.createElement('canvas');if(rows<10||rows>10000)throw new Error('Dimensão Z64 inválida');c.width=bpr*8;c.height=rows;const x=c.getContext('2d'),im=x.createImageData(c.width,c.height);for(let y=0;y<rows;y++)for(let col=0;col<bpr;col++){const v=data[y*bpr+col]||0;for(let bit=0;bit<8;bit++){const p=(y*c.width+col*8+bit)*4,k=v&(128>>bit)?0:255;im.data[p]=im.data[p+1]=im.data[p+2]=k;im.data[p+3]=255}}x.putImageData(im,0,0);r.push(c)}return r}function delivery(t){t=t.toLowerCase();if(/entrega\s*direta|vendedor/.test(t))return'ENTREGA DIRETA';if(/shopee\s*xpress|shopee\s*express|\bspx\b/.test(t))return'SHOPEE XPRESS';if(/correios|sedex|\bpac\b/.test(t))return'CORREIOS';if(/mercado\s*envios|mercado\s*livre/.test(t))return'MERCADO ENVIOS';return'REVISAR ENTREGA'}function quantity(t){const q=+(t.match(/(?:qtd|quantidade)\s*[:#-]?\s*(\d+)/i)||[])[1]||1,m=t.match(/(\d+)\s*(?:kits?|pacotes?|caixas?)\s*(?:de|com)?\s*(\d+)\s*([a-zà-ÿ ]+)/i)||t.match(/(\d+)\s*x\s*(\d+)\s*([a-zà-ÿ ]+)/i);if(m)return(+m[1]*+m[2])+' '+m[3].trim();const k=t.match(/(?:kit|pacote|caixa)\s*(?:de|com)?\s*(\d+)\s*([a-zà-ÿ ]+)/i);return k&&q>1?(q*+k[1])+' '+k[2].trim():String(q)}function parse(t){const lines=t.split(NL).map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean),f=r=>lines.find(x=>r.test(x))||'',all=lines.join(' | ');return{text:t,entrega:delivery(all),produto:f(/produto|item|kit|buch|parafus|pacote|caixa/i),sku:f(/\bsku\b|ref\.?/i),pedido:f(/pedido|order/i),rastreio:f(/rastreio|tracking|\bSPX[A-Z0-9]+|\bBR[A-Z0-9]{8,}/i),qtd:quantity(all)}}function card(d,c,i){const w=document.createElement('div');w.className='card';const frame=document.createElement('div');frame.className='img';frame.appendChild(c);w.appendChild(frame);w.insertAdjacentHTML('beforeend','<div class="result"><div class="row"><div><b>ETIQUETA '+(i+1)+'</b><div class="big">'+esc(d.entrega)+'</div></div><div class="big">'+esc(d.qtd)+'</div></div><div class="box"><b>PRODUTO</b><div class="big">'+esc(d.produto||'Revisar no original')+'</div><div class="small">SKU: '+esc(d.sku||'não identificado')+'</div></div><div class="box"><b>PEDIDO / RASTREIO</b><div class="small">'+esc(d.pedido||'não identificado')+'<br>'+esc(d.rastreio||'não identificado')+'</div></div><details><summary>Texto reconhecido</summary><div class="raw">'+esc(d.text)+'</div></details></div>');return w}async function run(){const raw=z.value.trim();if(!raw){msg('Cole um ZPL antes de continuar.','err');return}go.disabled=true;go.textContent='Processando...';out.innerHTML='<div class="empty">Clique recebido. Preparando...</div>';progress(3);try{await libraries();msg('Abrindo a imagem Z64...','warn');const cs=images(raw);if(!cs.length)throw new Error('Nenhuma imagem GRF/Z64 encontrada');const parsed=[];out.innerHTML='';for(let i=0;i<cs.length;i++){const res=await window.Tesseract.recognize(cs[i],'por+eng',{logger:m=>{if(typeof m.progress==='number'){progress(((i+m.progress)/cs.length)*100);msg('Lendo etiqueta '+(i+1)+' de '+cs.length+': '+Math.round(m.progress*100)+'%','warn')}}}),d=parse(res.data.text||'');parsed.push(d);out.appendChild(card(d,cs[i],i))}result=parsed.map((d,i)=>['ETIQUETA '+(i+1),'ENTREGA: '+d.entrega,'PRODUTO: '+(d.produto||'REVISAR'),'SKU: '+(d.sku||'REVISAR'),'PEDIDO: '+(d.pedido||'REVISAR'),'RASTREIO: '+(d.rastreio||'REVISAR'),'QTD TOTAL: '+d.qtd,'','OCR:',d.text].join(NL)).join(NL+NL+'--------'+NL+NL);cp.disabled=dl.disabled=false;progress(100);msg(parsed.length+' etiqueta(s) lida(s). Confira o resultado.','ok');out.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){console.error(e);out.innerHTML='<div class="empty"><b>Erro:</b><br>'+esc(e.message)+'</div>';msg('Erro: '+e.message,'err');progress(0)}finally{go.disabled=false;go.textContent='Gerar etiquetas'}}go.addEventListener('click',run);q('#clear').addEventListener('click',()=>{z.value='';result='';out.innerHTML='<div class="empty">Nenhuma etiqueta processada.</div>';cp.disabled=dl.disabled=true;msg('Pronto.','ok');progress(0)});cp.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(result);msg('Resultado copiado.','ok')}catch(e){msg('Use o botão Baixar .txt.','err')}});dl.addEventListener('click',()=>{const b=new Blob([result],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='leitura-etiquetas.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});})();</script></body></html>
