<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etiqueta ZPL Otimizada</title>
<style>
:root{--ink:#111;--paper:#f4f1ea;--card:#fff;--muted:#6d685f;--line:#d8d2c7;--accent:#6d3df5;--ok:#137a4b;--warn:#9a5b00;--danger:#b42318}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{width:min(1120px,calc(100% - 24px));margin:auto}header{padding:20px 0;border-bottom:1px solid var(--line);font-size:20px;font-weight:900}h1{font-size:clamp(38px,6vw,68px);line-height:.94;letter-spacing:-.055em;margin:36px 0 12px}.lead{font-size:17px;color:var(--muted);margin:0 0 25px;max-width:760px;line-height:1.5}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;padding-bottom:42px}.panel{min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px}h2{margin:0 0 12px;font-size:22px}textarea{display:block;width:100%;min-width:0;min-height:390px;border:1px solid #cfc8bd;border-radius:12px;padding:12px;background:#fbfaf7;font:12px/1.4 Consolas,monospace;resize:vertical;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:999px;padding:12px 17px;font-weight:850;cursor:pointer}.primary{background:var(--accent);color:white}.dark{background:#111;color:white}.ghost{background:#ece8df;color:#111}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:43px;margin-top:10px;font-weight:750;line-height:1.4}.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--danger)}.progress{height:8px;background:#e7e0d5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.output{min-height:390px;border:1px dashed #bbb2a5;border-radius:12px;padding:12px;overflow:hidden}.empty{color:var(--muted);text-align:center;margin:145px auto;line-height:1.5}.summary{max-width:520px;margin:0 auto 12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f7f4ed;line-height:1.45}.card{max-width:520px;margin:0 auto 14px;border:2px solid #111;background:#fff;padding:12px}.image{max-height:520px;overflow:auto;border:1px solid #ccc;background:#eee}.image canvas{display:block;width:100%;height:auto;background:#fff}.card-head{display:flex;justify-content:space-between;gap:12px;border-bottom:3px solid #111;padding:9px 0}.delivery{font-size:21px;font-weight:900}.badge{font-size:12px;font-weight:900;text-align:right}.box{border:2px solid #111;padding:9px;margin-top:8px}.box strong{font-size:12px;letter-spacing:.06em}.big{font-size:20px;font-weight:900;margin-top:4px;overflow-wrap:anywhere}.small{font-size:12px;color:#555;line-height:1.4;margin-top:4px;overflow-wrap:anywhere}.excluded{max-width:520px;margin:8px auto;border:1px solid #d0a56c;background:#fff7ea;padding:10px;border-radius:10px;font-size:13px}.raw{white-space:pre-wrap;background:#eee;padding:8px;max-height:150px;overflow:auto;font:11px/1.35 Consolas,monospace;overflow-wrap:anywhere}details{margin-top:8px}summary{cursor:pointer;font-size:13px;font-weight:700}
@media(max-width:880px){.grid{grid-template-columns:1fr}textarea{min-height:300px}}@media(max-width:520px){.wrap{width:calc(100% - 16px)}.panel{padding:12px}.actions button{flex:1 1 100%}.card-head{display:block}.badge{text-align:left;margin-top:5px}}
</style>
</head>
<body>
<header><div class="wrap">Etiqueta ZPL Otimizada</div></header>
<main class="wrap">
<h1>Gerar ZPL imprimível</h1>
<p class="lead">O site lê os gráficos da Shopee, remove declaração de conteúdo e checklist, e gera um arquivo ZPL real para a impressora térmica.</p>
<div class="grid">
<section class="panel">
<h2>1. Cole o ZPL original</h2>
<textarea id="zpl" spellcheck="false" placeholder="Cole aqui o ZPL completo da Shopee..."></textarea>
<div class="actions"><button type="button" class="primary" id="generate">Gerar ZPL</button><button type="button" class="ghost" id="clear">Limpar</button></div>
<div id="status" class="status ok">Pronto.</div>
<div class="progress"><span id="bar"></span></div>
</section>
<section class="panel">
<h2>2. Etiquetas mantidas</h2>
<div id="output" class="output"><div class="empty">Nenhuma etiqueta processada.</div></div>
<div class="actions"><button type="button" class="dark" id="copy" disabled>Copiar ZPL</button><button type="button" class="primary" id="download" disabled>Baixar ZPL .txt</button></div>
</section>
</div>
</main>
<script>
(function(){
'use strict';
const NL='\n';
const $=s=>document.querySelector(s);
const input=$('#zpl'),generate=$('#generate'),status=$('#status'),output=$('#output'),bar=$('#bar'),copy=$('#copy'),download=$('#download');
let finalZpl='',libraryPromise=null;

function message(text,type){status.textContent=text;status.className='status '+type}
function progress(value){bar.style.width=Math.max(0,Math.min(100,value))+'%'}
function escapeHtml(value){return String(value||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadScript(url){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=url;script.onload=resolve;script.onerror=()=>reject(new Error('Falha ao carregar '+url));document.head.appendChild(script)})}
async function loadOne(urls,test){if(test())return;for(const url of urls){try{await loadScript(url);if(test())return}catch(error){console.warn(error)}}throw new Error('Não foi possível carregar as bibliotecas de leitura')}
function loadLibraries(){if(!libraryPromise){libraryPromise=(async()=>{message('Carregando leitor de etiquetas...','warn');await loadOne(['https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js','https://unpkg.com/pako@2.1.0/dist/pako.min.js'],()=>Boolean(window.pako));await loadOne(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'],()=>Boolean(window.Tesseract))})().catch(error=>{libraryPromise=null;throw error})}return libraryPromise}

function decodeBytes(base64,total){const compressed=Uint8Array.from(atob(base64),char=>char.charCodeAt(0));const inflated=window.pako.inflate(compressed);if(inflated.length===total)return inflated;const decodedText=new TextDecoder().decode(inflated).replace(/\s/g,'');if(/^[0-9a-f]+$/i.test(decodedText)&&decodedText.length>=total*2){const bytes=new Uint8Array(total);for(let i=0;i<total;i++)bytes[i]=parseInt(decodedText.slice(i*2,i*2+2),16);return bytes}return inflated.slice(0,total)}

function extractGraphics(raw){const normalized=raw.replace(/\r?\n/g,'');const regex=/(?:~DG|\^DG)([^,]+),(\d+),(\d+),:Z64:([A-Za-z0-9+/=]+)(?::([0-9A-Fa-f]+))?/g;const graphics=[];let match;while((match=regex.exec(normalized))){const total=Number(match[2]),bytesPerRow=Number(match[3]);if(!total||!bytesPerRow)continue;const payload=match[4],checksum=match[5]||'';const bytes=decodeBytes(payload,total);const rows=Math.ceil(total/bytesPerRow);if(rows<10||rows>10000)continue;const canvas=document.createElement('canvas');canvas.width=bytesPerRow*8;canvas.height=rows;const context=canvas.getContext('2d');const image=context.createImageData(canvas.width,canvas.height);for(let y=0;y<rows;y++){for(let x=0;x<bytesPerRow;x++){const value=bytes[y*bytesPerRow+x]||0;for(let bit=0;bit<8;bit++){const position=(y*canvas.width+x*8+bit)*4;const color=(value&(128>>bit))?0:255;image.data[position]=color;image.data[position+1]=color;image.data[position+2]=color;image.data[position+3]=255}}}context.putImageData(image,0,0);graphics.push({total,bytesPerRow,payload,checksum,rows,width:canvas.width,canvas,text:'',kind:'unknown'})}return graphics}

function normalizeText(text){return String(text||'').replace(/\s+/g,' ').trim()}
function classify(text){const normalized=normalizeText(text).toLowerCase();const declaration=/declara[cç][aã]o\s+de\s+conte[uú]do|checklist\s+de\s+carregamento|aten[cç][aã]o[, ]+vendedor|assinatura\s+do\s+recebedor|descri[cç][aã]o\s+do\s+conte[uú]do|valor\s+total|varia[cç][aã]o/.test(normalized);if(declaration)return'declaration';const shipping=/entrega\s+direta|shopee\s+xpress|shopee\s+express|\bspx\b|destinat[aá]rio|endere[cç]o|cep\s*[:#-]|pedido\s*[:#-]|rastreio|remetente|c[oó]digo\s+de\s+barras/.test(normalized);return shipping?'shipping':'unknown'}
function deliveryType(text){const normalized=normalizeText(text).toLowerCase();if(/entrega\s+direta|entrega\s+do\s+vendedor|envio\s+pr[oó]prio/.test(normalized))return'ENTREGA DIRETA';if(/shopee\s+xpress|shopee\s+express|\bspx\b/.test(normalized))return'SHOPEE XPRESS';if(/correios|sedex|\bpac\b/.test(normalized))return'CORREIOS';return'ENTREGA IDENTIFICADA'}
function extractInfo(text){const lines=String(text||'').split(/\n+/).map(normalizeText).filter(Boolean);const find=regex=>lines.find(line=>regex.test(line))||'';const all=lines.join(' | ');const product=find(/produto|item|kit|buch|parafus|pacote|caixa|conjunto/i);const sku=find(/\bsku\b|ref\.?|c[oó]digo\s+do\s+produto/i);const order=find(/pedido|order/i);const tracking=find(/rastreio|tracking|\bSPX[A-Z0-9-]+|\bBR[A-Z0-9]{8,}/i);const cep=(all.match(/\b\d{5}-?\d{3}\b/)||[])[0]||'';return{delivery:deliveryType(all),product,sku,order,tracking,cep}}

async function recognize(graphic,index,total){const result=await window.Tesseract.recognize(graphic.canvas,'por+eng',{logger:event=>{if(typeof event.progress==='number'){progress(((index+event.progress)/total)*100);message('Lendo imagem '+(index+1)+' de '+total+': '+Math.round(event.progress*100)+'%','warn')}}});graphic.text=result.data.text||'';graphic.kind=classify(graphic.text);graphic.info=extractInfo(graphic.text);return graphic}

function graphicZpl(graphic,index){const name='ETQ'+String(index+1).padStart(3,'0')+'.GRF';const checksum=graphic.checksum?':'+graphic.checksum:'';return '~DGR:'+name+','+graphic.total+','+graphic.bytesPerRow+',:Z64:'+graphic.payload+checksum+NL+
'^XA'+NL+
'^MMT,Y'+NL+
'^PON'+NL+
'^MNY'+NL+
'^PW'+graphic.width+NL+
'^LL'+graphic.rows+NL+
'^FO0,0^XGR:'+name+',1,1^FS'+NL+
'^PQ1,0,0,N'+NL+
'^XZ'+NL+
'^XA^IDR:'+name+'^FS^XZ';}
function buildPrintable(graphics){return graphics.map(graphicZpl).join(NL+NL)}

function appendCard(graphic,index){const card=document.createElement('div');card.className='card';const frame=document.createElement('div');frame.className='image';frame.appendChild(graphic.canvas);card.appendChild(frame);const info=graphic.info||extractInfo(graphic.text);card.insertAdjacentHTML('beforeend','<div class="card-head"><div><div class="badge">ETIQUETA '+(index+1)+'</div><div class="delivery">'+escapeHtml(info.delivery)+'</div></div><div class="badge">MANTIDA NO ZPL</div></div><div class="box"><strong>PRODUTO LIDO</strong><div class="big">'+escapeHtml(info.product||'Conferir na imagem')+'</div><div class="small">SKU: '+escapeHtml(info.sku||'não identificado')+'</div></div><div class="box"><strong>PEDIDO / RASTREIO</strong><div class="small">'+escapeHtml(info.order||'não identificado')+'<br>'+escapeHtml(info.tracking||'não identificado')+(info.cep?'<br>CEP: '+escapeHtml(info.cep):'')+'</div></div><details><summary>Texto reconhecido</summary><div class="raw">'+escapeHtml(graphic.text)+'</div></details>');output.appendChild(card)}

async function run(){const raw=input.value.trim();if(!raw){message('Cole um ZPL antes de continuar.','err');return}generate.disabled=true;generate.textContent='Processando...';copy.disabled=download.disabled=true;finalZpl='';output.innerHTML='<div class="empty">Clique recebido. Preparando leitura...</div>';progress(2);try{await loadLibraries();message('Abrindo gráficos Z64...','warn');const graphics=extractGraphics(raw);if(!graphics.length)throw new Error('Nenhum gráfico GRF/Z64 foi encontrado');for(let i=0;i<graphics.length;i++)await recognize(graphics[i],i,graphics.length);const declarations=graphics.filter(item=>item.kind==='declaration');let kept=graphics.filter(item=>item.kind==='shipping');if(!kept.length){kept=graphics.filter(item=>item.kind!=='declaration')}if(!kept.length)throw new Error('Só foram encontradas páginas de declaração/checklist');finalZpl=buildPrintable(kept);output.innerHTML='';const summary=document.createElement('div');summary.className='summary';summary.innerHTML='<strong>'+kept.length+' etiqueta(s) pronta(s) para impressão</strong><br>'+declarations.length+' página(s) de declaração/checklist removida(s).<br>O arquivo baixado agora contém comandos ZPL, não relatório de OCR.';output.appendChild(summary);kept.forEach(appendCard);if(declarations.length){const excluded=document.createElement('div');excluded.className='excluded';excluded.textContent=declarations.length+' imagem(ns) excluída(s): declaração de conteúdo/checklist.';output.appendChild(excluded)}copy.disabled=download.disabled=false;progress(100);message(kept.length+' etiqueta(s) gerada(s). '+declarations.length+' declaração(ões) removida(s).','ok');output.scrollIntoView({behavior:'smooth',block:'start'})}catch(error){console.error(error);output.innerHTML='<div class="empty"><strong>Erro:</strong><br>'+escapeHtml(error.message)+'</div>';message('Erro: '+error.message,'err');progress(0)}finally{generate.disabled=false;generate.textContent='Gerar ZPL'}}

generate.addEventListener('click',run);
$('#clear').addEventListener('click',()=>{input.value='';finalZpl='';output.innerHTML='<div class="empty">Nenhuma etiqueta processada.</div>';copy.disabled=download.disabled=true;message('Pronto.','ok');progress(0)});
copy.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(finalZpl);message('ZPL copiado para a área de transferência.','ok')}catch(error){message('Não foi possível copiar. Use Baixar ZPL .txt.','err')}});
download.addEventListener('click',()=>{if(!finalZpl)return;const blob=new Blob([finalZpl],{type:'text/plain;charset=utf-8'});const anchor=document.createElement('a');anchor.href=URL.createObjectURL(blob);anchor.download='etiquetas-shopee-sem-declaracao.txt';anchor.click();setTimeout(()=>URL.revokeObjectURL(anchor.href),1000)});
})();
</script>
</body>
</html>
