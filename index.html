<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Etiqueta ZPL Otimizada</title>
<style>
:root{--ink:#111;--paper:#f4f1ea;--line:#d8d2c7;--accent:#6d3df5;--ok:#137a4b;--warn:#9a5b00;--err:#b42318}
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.wrap{width:min(1160px,calc(100% - 24px));margin:auto}header{padding:20px 0;border-bottom:1px solid var(--line);font-weight:900;font-size:20px}h1{font-size:clamp(38px,6vw,70px);line-height:.94;letter-spacing:-.055em;margin:36px 0 12px}.lead{font-size:17px;color:#6d685f;line-height:1.5;max-width:820px;margin:0 0 24px}.grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:18px;padding-bottom:42px}.panel{min-width:0;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px}h2{margin:0 0 12px;font-size:22px}textarea{display:block;width:100%;min-width:0;min-height:390px;border:1px solid #cfc8bd;border-radius:12px;padding:12px;background:#fbfaf7;font:12px/1.4 Consolas,monospace;resize:vertical;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:0;border-radius:999px;padding:12px 17px;font-weight:850;cursor:pointer}.primary{background:var(--accent);color:#fff}.dark{background:#111;color:#fff}.ghost{background:#ece8df;color:#111}button:disabled{opacity:.45;cursor:not-allowed}.status{min-height:43px;margin-top:10px;font-weight:750;line-height:1.4}.ok{color:var(--ok)}.warn{color:var(--warn)}.err{color:var(--err)}.progress{height:8px;background:#e7e0d5;border-radius:999px;overflow:hidden}.progress span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}.output{min-height:390px;border:1px dashed #bbb2a5;border-radius:12px;padding:12px;overflow:hidden}.empty{color:#6d685f;text-align:center;margin:145px auto;line-height:1.5}.summary{max-width:560px;margin:0 auto 12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f7f4ed;line-height:1.45}.card{max-width:560px;margin:0 auto 16px;border:2px solid #111;background:#fff;padding:12px}.card h3{margin:0 0 9px;font-size:17px}.image{max-height:680px;overflow:auto;border:1px solid #ccc;background:#eee}.image canvas{display:block;width:100%;height:auto;background:#fff}.meta{font-size:13px;line-height:1.45;margin-top:9px}.raw{white-space:pre-wrap;background:#eee;padding:8px;max-height:160px;overflow:auto;font:11px/1.35 Consolas,monospace;overflow-wrap:anywhere}details{margin-top:8px}summary{cursor:pointer;font-size:13px;font-weight:700}.tag{display:inline-block;border:1px solid #111;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:900;margin-right:5px}
@media(max-width:900px){.grid{grid-template-columns:1fr}textarea{min-height:300px}}@media(max-width:520px){.wrap{width:calc(100% - 16px)}.panel{padding:12px}.actions button{flex:1 1 100%}}
</style>
</head>
<body>
<header><div class="wrap">Etiqueta ZPL Otimizada</div></header>
<main class="wrap">
<h1>Fundir envio + separação</h1>
<p class="lead">A etiqueta de envio é preservada. A declaração ou checklist é lida e os itens para embalar são inseridos na mesma etiqueta, com produto, SKU e quantidade total.</p>
<div class="grid">
<section class="panel">
<h2>1. Cole o ZPL completo</h2>
<textarea id="zpl" placeholder="Cole aqui o arquivo da Shopee com etiqueta de envio e declaração/checklist..."></textarea>
<div class="actions"><button id="go" type="button" class="primary">Fundir etiquetas</button><button id="clear" type="button" class="ghost">Limpar</button></div>
<div id="status" class="status ok">Pronto.</div><div class="progress"><span id="bar"></span></div>
</section>
<section class="panel">
<h2>2. Resultado imprimível</h2>
<div id="out" class="output"><div class="empty">Nenhuma etiqueta processada.</div></div>
<div class="actions"><button id="copy" type="button" class="dark" disabled>Copiar ZPL</button><button id="download" type="button" class="primary" disabled>Baixar ZPL .txt</button></div>
</section>
</div>
</main>
<script>
(function(){
'use strict';
const NL='\n',q=s=>document.querySelector(s),z=q('#zpl'),go=q('#go'),st=q('#status'),out=q('#out'),bar=q('#bar'),cp=q('#copy'),dl=q('#download');
let finalZpl='',libsPromise=null;
function msg(t,c){st.textContent=t;st.className='status '+c}
function progress(n){bar.style.width=Math.max(0,Math.min(100,n))+'%'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function loadScript(src){return new Promise((resolve,reject)=>{const el=document.createElement('script');el.src=src;el.onload=resolve;el.onerror=()=>reject(new Error('Falha ao carregar '+src));document.head.appendChild(el)})}
async function loadAny(urls,test){if(test())return;for(const url of urls){try{await loadScript(url);if(test())return}catch(e){}}throw new Error('Não foi possível carregar as bibliotecas de leitura')}
function loadLibraries(){if(!libsPromise)libsPromise=(async()=>{msg('Carregando leitor...','warn');await loadAny(['https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js','https://unpkg.com/pako@2.1.0/dist/pako.min.js'],()=>!!window.pako);await loadAny(['https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','https://unpkg.com/tesseract.js@5/dist/tesseract.min.js'],()=>!!window.Tesseract)})().catch(e=>{libsPromise=null;throw e});return libsPromise}
function z64Bytes(base64,total){const compressed=Uint8Array.from(atob(base64),c=>c.charCodeAt(0)),inflated=window.pako.inflate(compressed);if(inflated.length===total)return inflated;const text=new TextDecoder().decode(inflated).replace(/\s/g,'');if(/^[0-9a-f]+$/i.test(text)&&text.length>=total*2){const bytes=new Uint8Array(total);for(let i=0;i<total;i++)bytes[i]=parseInt(text.slice(i*2,i*2+2),16);return bytes}return inflated.slice(0,total)}
function decodeImages(raw){const compact=raw.replace(/[\r\n]/g,''),rx=/(?:~DG|\^DG)([^,]+),(\d+),(\d+),:Z64:([A-Za-z0-9+/=]+)(?::[0-9A-Fa-f]+)?/g,items=[];let m,index=0;while((m=rx.exec(compact))){const total=+m[2],bpr=+m[3],bytes=z64Bytes(m[4],total),rows=Math.ceil(total/bpr);if(!bpr||rows<10||rows>12000)continue;const canvas=document.createElement('canvas');canvas.width=bpr*8;canvas.height=rows;const ctx=canvas.getContext('2d'),img=ctx.createImageData(canvas.width,canvas.height);for(let y=0;y<rows;y++)for(let x=0;x<bpr;x++){const v=bytes[y*bpr+x]||0;for(let bit=0;bit<8;bit++){const p=(y*canvas.width+x*8+bit)*4,val=v&(128>>bit)?0:255;img.data[p]=img.data[p+1]=img.data[p+2]=val;img.data[p+3]=255}}ctx.putImageData(img,0,0);items.push({index:index++,canvas,text:''})}return items}
async function ocr(item,i,total){const res=await window.Tesseract.recognize(item.canvas,'por+eng',{logger:m=>{if(typeof m.progress==='number'){progress(((i+m.progress)/total)*70);msg('Lendo página '+(i+1)+' de '+total+': '+Math.round(m.progress*100)+'%','warn')}}});item.text=res.data.text||'';return item}
function shippingScore(text){const t=text.toLowerCase();let s=0;if(/destinat[aá]rio|recebedor|endere[cç]o/.test(t))s+=4;if(/rastreio|tracking|pedido/.test(t))s+=3;if(/shopee\s*xpress|entrega\s*direta|correios|sedex|spx/.test(t))s+=3;if(/cep\s*[:\-]?\s*\d/.test(t))s+=2;if(/declara[cç][aã]o de conte[uú]do|checklist de carregamento/.test(t))s-=6;return s}
function detailScore(text){const t=text.toLowerCase();let s=0;if(/declara[cç][aã]o de conte[uú]do|checklist de carregamento/.test(t))s+=6;if(/produto|varia[cç][aã]o|quantidade|qtd|sku/.test(t))s+=4;if(/destinat[aá]rio|rastreio|endere[cç]o/.test(t))s-=2;return s}
function delivery(text){const t=text.toLowerCase();if(/entrega\s*direta|entrega\s*do\s*vendedor|envio\s*pr[oó]prio/.test(t))return'ENTREGA DIRETA';if(/shopee\s*xpress|shopee\s*express|\bspx\b/.test(t))return'SHOPEE XPRESS';if(/correios|sedex|\bpac\b/.test(t))return'CORREIOS';if(/mercado\s*envios|mercado\s*livre/.test(t))return'MERCADO ENVIOS';return'ENTREGA'}
function cleanLine(s){return String(s||'').replace(/[|_]+/g,' ').replace(/\s+/g,' ').trim()}
function quantityTotal(text){const q=+(text.match(/(?:qtd|quantidade)\s*[:#-]?\s*(\d+)/i)||[])[1]||1;let m=text.match(/(\d+)\s*(?:kits?|pacotes?|caixas?|conjuntos?)\s*(?:de|com|c\/)?\s*(\d+)\s*([a-zà-ÿ][a-zà-ÿ\s-]{1,35})/i)||text.match(/(\d+)\s*[xX]\s*(\d+)\s*([a-zà-ÿ][a-zà-ÿ\s-]{1,35})/i);if(m)return{n:+m[1]*+m[2],label:(+m[1]*+m[2])+' '+cleanLine(m[3]).split(/sku|pedido|rastreio/i)[0]};m=text.match(/(?:kit|pacote|caixa|conjunto)\s*(?:de|com|c\/)?\s*(\d+)\s*([a-zà-ÿ][a-zà-ÿ\s-]{1,35})/i);if(m&&q>1)return{n:q*+m[1],label:(q*+m[1])+' '+cleanLine(m[2]).split(/sku|pedido|rastreio/i)[0]};return{n:q,label:String(q)} }
function parseDetail(text){const lines=text.split(/\n+/).map(cleanLine).filter(Boolean);const blocked=/shopee|checklist|declara[cç][aã]o|aten[cç][aã]o|seller|pedido|cep|carregamento|varia[cç][aã]o|quantidade|produto|sku/i;const labelled=(rx)=>{const line=lines.find(x=>rx.test(x));if(!line)return'';const after=line.replace(/^.*?[:\-]\s*/,'').trim();if(after&&after!==line)return after;const idx=lines.indexOf(line);return lines[idx+1]||''};let product=labelled(/produto|descri[cç][aã]o|item/i);if(!product||product.length<4){product=lines.filter(x=>x.length>=8&&!blocked.test(x)&&!/^\d+$/.test(x)).sort((a,b)=>b.length-a.length)[0]||''}let sku=labelled(/\bsku\b|c[oó]digo do produto|ref\.?/i)||labelled(/varia[cç][aã]o/i);const qty=quantityTotal(lines.join(' | '));return{product:cleanLine(product),sku:cleanLine(sku),qty,raw:text}}
function pairPages(items){const shipping=[],details=[];for(const item of items){const ss=shippingScore(item.text),ds=detailScore(item.text);if(ss>=ds&&ss>=3)shipping.push(item);else details.push(item)}if(!shipping.length&&items.length){shipping.push(items[0]);details.push(...items.slice(1))}const used=new Set(),pairs=[];for(const ship of shipping){let best=null,bestDist=1e9;for(const det of details){if(used.has(det.index))continue;const dist=det.index>=ship.index?det.index-ship.index:1000+ship.index-det.index;if(dist<bestDist){best=det;bestDist=dist}}if(best)used.add(best.index);pairs.push({ship,detail:best})}return pairs}
function wrapText(ctx,text,x,y,maxWidth,lineHeight,maxLines){const words=cleanLine(text).split(' '),lines=[];let line='';for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word;if(lines.length===maxLines-1)break}else line=test}if(line&&lines.length<maxLines)lines.push(line);lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineHeight));return lines.length}
function blankBand(canvas,needed){const ctx=canvas.getContext('2d'),data=ctx.getImageData(0,0,canvas.width,canvas.height).data,start=Math.floor(canvas.height*.35);let run=0,best=null;for(let y=start;y<canvas.height;y++){let dark=0;const step=Math.max(1,Math.floor(canvas.width/300));for(let x=0;x<canvas.width;x+=step){const p=(y*canvas.width+x)*4;if(data[p]<210)dark++}const blank=dark/(canvas.width/step)<.015;if(blank)run++;else run=0;if(run>=needed){best=y-run+1;break}}return best}
function fuseCanvas(shipCanvas,detail,shipText){const W=shipCanvas.width,boxH=Math.max(190,Math.round(W*.26)),band=blankBand(shipCanvas,boxH+10),H=band===null?shipCanvas.height+boxH:shipCanvas.height,out=document.createElement('canvas');out.width=W;out.height=H;const ctx=out.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.drawImage(shipCanvas,0,0);const y0=band===null?shipCanvas.height:band;ctx.fillStyle='#fff';ctx.fillRect(0,y0,W,boxH);ctx.strokeStyle='#000';ctx.lineWidth=Math.max(3,Math.round(W/230));ctx.strokeRect(8,y0+8,W-16,boxH-16);ctx.fillStyle='#000';const pad=22,left=pad,top=y0+34;ctx.font='bold '+Math.max(22,Math.round(W/26))+'px Arial';ctx.fillText('SEPARAÇÃO • '+delivery(shipText),left,top);ctx.font='bold '+Math.max(30,Math.round(W/18))+'px Arial';const product=detail.product||'PRODUTO: REVISAR DECLARAÇÃO';wrapText(ctx,product,left,top+48,W-220,Math.max(34,Math.round(W/17)),2);ctx.font='bold '+Math.max(22,Math.round(W/28))+'px Arial';ctx.fillText('SKU: '+(detail.sku||'REVISAR'),left,H-28);ctx.font='bold '+Math.max(28,Math.round(W/20))+'px Arial';ctx.textAlign='right';ctx.fillText('QTD TOTAL',W-pad,top+3);ctx.font='bold '+Math.max(42,Math.round(W/13))+'px Arial';ctx.fillText(detail.qty.label,W-pad,top+64);ctx.textAlign='left';return out}
function canvasToGfa(canvas){const ctx=canvas.getContext('2d'),img=ctx.getImageData(0,0,canvas.width,canvas.height).data,bpr=Math.ceil(canvas.width/8),bytes=new Uint8Array(bpr*canvas.height);for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++){const p=(y*canvas.width+x)*4,lum=(img[p]+img[p+1]+img[p+2])/3;if(lum<160)bytes[y*bpr+(x>>3)]|=128>>(x&7)}let hex='';for(let i=0;i<bytes.length;i++)hex+=bytes[i].toString(16).padStart(2,'0').toUpperCase();return'^XA'+NL+'^PW'+canvas.width+NL+'^LL'+canvas.height+NL+'^FO0,0^GFA,'+bytes.length+','+bytes.length+','+bpr+','+hex+'^FS'+NL+'^XZ'}
function showCard(pair,fused,index,detail){const card=document.createElement('div');card.className='card';card.innerHTML='<h3>Etiqueta '+(index+1)+' fundida</h3><div><span class="tag">'+esc(delivery(pair.ship.text))+'</span><span class="tag">'+esc(detail.qty.label)+'</span></div>';const frame=document.createElement('div');frame.className='image';frame.appendChild(fused);card.appendChild(frame);card.insertAdjacentHTML('beforeend','<div class="meta"><b>Produto:</b> '+esc(detail.product||'REVISAR')+'<br><b>SKU:</b> '+esc(detail.sku||'REVISAR')+'<br><b>Quantidade total:</b> '+esc(detail.qty.label)+'</div><details><summary>OCR da declaração/checklist</summary><div class="raw">'+esc(detail.raw||'Nenhuma declaração pareada')+'</div></details>');out.appendChild(card)}
async function run(){const raw=z.value.trim();if(!raw){msg('Cole um ZPL antes de continuar.','err');return}go.disabled=true;go.textContent='Processando...';out.innerHTML='<div class="empty">Clique recebido. Abrindo as páginas...</div>';progress(2);try{await loadLibraries();const items=decodeImages(raw);if(!items.length)throw new Error('Nenhum gráfico GRF/Z64 foi encontrado');for(let i=0;i<items.length;i++)await ocr(items[i],i,items.length);msg('Relacionando etiqueta de envio com declaração/checklist...','warn');progress(75);const pairs=pairPages(items);if(!pairs.length)throw new Error('Não encontrei etiqueta de envio para fundir');out.innerHTML='';const zpls=[];let missing=0;pairs.forEach((pair,i)=>{const detail=parseDetail(pair.detail?pair.detail.text:'');if(!detail.product)missing++;const fused=fuseCanvas(pair.ship.canvas,detail,pair.ship.text);zpls.push(canvasToGfa(fused));showCard(pair,fused,i,detail)});finalZpl=zpls.join(NL+NL);cp.disabled=dl.disabled=false;progress(100);const summary=document.createElement('div');summary.className='summary';summary.innerHTML='<b>'+pairs.length+' etiqueta(s) de envio fundida(s).</b><br>As páginas de declaração/checklist foram usadas como fonte dos itens e não serão impressas separadamente.'+(missing?'<br><b>'+missing+' etiqueta(s) ainda precisam de conferência do produto.</b>':'');out.prepend(summary);msg(pairs.length+' etiqueta(s) prontas em ZPL imprimível.','ok');out.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){console.error(e);out.innerHTML='<div class="empty"><b>Erro:</b><br>'+esc(e.message)+'</div>';msg('Erro: '+e.message,'err');progress(0)}finally{go.disabled=false;go.textContent='Fundir etiquetas'}}
go.addEventListener('click',run);q('#clear').addEventListener('click',()=>{z.value='';finalZpl='';out.innerHTML='<div class="empty">Nenhuma etiqueta processada.</div>';cp.disabled=dl.disabled=true;msg('Pronto.','ok');progress(0)});cp.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(finalZpl);msg('ZPL copiado.','ok')}catch(e){msg('Use o botão de download.','err')}});dl.addEventListener('click',()=>{const blob=new Blob([finalZpl],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='etiquetas-fundidas-envio-separacao.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
})();
</script>
</body>
</html>
